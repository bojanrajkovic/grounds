name: Publish Release Packages

on:
  workflow_call:

jobs:
  publish-release:
    runs-on: ubuntu-latest
    environment: release

    # Don't cancel a running publish: stopping midway can leave packages on npm
    # without their tags and GitHub Releases.
    concurrency:
      group: publish-release
      cancel-in-progress: false

    # GITHUB_TOKEN only checks out code. Git writes use the releaser bot token below.
    permissions:
      id-token: write
      contents: read

    steps:
      # The releaser bot opens the Version Packages PR, commits to it, and creates
      # tags and GitHub Releases. Its token is needed because the tag ruleset only
      # lets the bot create tags, and PRs opened with GITHUB_TOKEN don't trigger CI.
      - name: Mint releaser bot token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASER_BOT_CLIENT_ID }}
          private-key: ${{ secrets.RELEASER_BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Setup mise
        uses: jdx/mise-action@d5574b52816a478f9d4e6529a3f6ff17a8a36785 # v5

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: pnpm build

      - name: Check if this is a release commit
        id: check-release
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          if [[ "$COMMIT_MSG" == "chore(release): version packages"* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
            echo "Skipping changeset generation - this is a release commit"
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      - name: Generate changesets from conventional commits
        if: steps.check-release.outputs.is_release != 'true'
        run: pnpm exec tsx scripts/generate-changeset.ts -p main -i HEAD

      - name: Check for releasable changesets
        id: check-changesets
        run: |
          # Check if any changesets would cause version bumps
          # Changesets with "none" bump type don't count
          if grep -r '"@grounds/.*": \(major\|minor\|patch\)' .changeset/*.md 2>/dev/null; then
            echo "has_changesets=true" >> $GITHUB_OUTPUT
            echo "Found releasable changesets"
          else
            echo "has_changesets=false" >> $GITHUB_OUTPUT
            echo "No releasable changesets (only chore/docs/test commits)"
          fi

      - name: Create Release Pull Request or Publish
        if: steps.check-changesets.outputs.has_changesets == 'true' || steps.check-release.outputs.is_release == 'true'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          # Commits and tags go through the GitHub API (the default), so they're
          # signed and attributed to the bot.
          github-token: ${{ steps.app-token.outputs.token }}
          version-script: pnpm run changeset-version
          publish-script: pnpm run release
          commit-message: "chore(release): version packages"
          pr-title: "chore(release): version packages"
        env:
          # npm authenticates through Trusted Publishing (the job's id-token),
          # so no NPM_TOKEN: changesets/action v2 no longer writes .npmrc.
          NPM_CONFIG_PROVENANCE: true
